name: Deploy staging to GitHub Pages

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build (with Pages base path)
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Inject noindex meta tag into all built HTML files
        run: |
          find dist -name '*.html' -print0 \
            | xargs -0 -I{} sed -i \
              's#<head>#<head>\n<meta name="robots" content="noindex, nofollow">#I' {}
          echo "Injected noindex into:"
          grep -rl 'noindex' --include='*.html' dist || true

      - name: Write blocking robots.txt
        run: |
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
